services:
  postgres:
    image: postgres:16-alpine
    container_name: nxflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nxflow}
      POSTGRES_USER: ${POSTGRES_USER:-nxflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nxflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nxflow} -d ${POSTGRES_DB:-nxflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
